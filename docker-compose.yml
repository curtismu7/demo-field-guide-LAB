services:
  demo-field-guide:
    build: .
    image: demo-field-guide-lab
    container_name: demo-field-guide-lab
    ports:
      - "127.0.0.1:7590:7590"
    environment:
      - PORT=7590
      - BIND=0.0.0.0
      - LAB_ALLOWED_HOSTS=${LAB_ALLOWED_HOSTS:-demo-field-guide.local.ping-devops.com}
    restart: unless-stopped
